name: smart-model-swap
version: "0.6.0"
manifest_version: 2
requires_hermes: ">=0.23.0"
license: MIT
tags: [models, local-llm, llama.cpp, inference-engines, vram, comfyui, gpu]
description: "Run a big and a small local LLM on one rig and let the agent switch between them by task: the small one for quick chat and to free VRAM for GPU jobs (ComfyUI), the big one for deep work. SmartModelProvider launches and stops the engine itself (llama.cpp; LM Studio in beta through its lms CLI; Ollama and vLLM detection only), swaps in the background without cutting replies, checks per-GPU VRAM before loading, restores the big model when idle, and ships a launch-parameter editor in the dashboard and Desktop."
author: "Oscar Carreto (DraksoN)"
kind: standalone
platforms:
  - linux
provides_tools:
  - sms_status
  - sms_plan
  - sms_swap
  - sms_restore
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - pre_transcription
config_schema:
  primary_model:
    type: str
    label: Primary model
    description: Model name (from models.json) restored by sms_restore and autostarted with the gateway.
    default: signal
  autostart_primary:
    type: bool
    label: Autostart the primary model
    description: When the gateway starts, SmartModelProvider always loads the primary model in the background (replaces the old llama-server systemd unit). A smaller model left serving is swapped for it, unless a GPU job or ComfyUI is running.
    default: true
  gpu_wait_s:
    type: int
    label: Autostart GPU / disk wait (s)
    description: At autostart, max seconds to wait for the NVIDIA driver and the model file (a WSL mount) to become ready.
    default: 180
  release_wait_s:
    type: int
    label: Release wait before loading (s)
    description: Before loading a model, wait up to this many seconds for other heavy GPU processes (ComfyUI, etc.) to release the VRAM it needs on each GPU. If they don't, the model is NOT loaded and the previous or smallest model that fits is loaded instead.
    default: 120
  isolate_scope:
    type: bool
    label: Isolate models from gateway restarts
    description: Run the runner and the watcher as transient user services (systemd-run --user) and each model in its own transient scope, so neither a gateway restart nor a killed command that started a swap (a terminal timeout) takes them down. Models are still started and stopped by SMP itself, by signal. Off, or without a user systemd, they are double-forked into their own session (survives a killed command, not a gateway restart).
    default: true
  models_file:
    type: str
    label: Models file
    description: Path to a custom models.json (engines + models; empty = bundled).
    default: ""
  nvidia_smi:
    type: str
    label: nvidia-smi
    description: Path to nvidia-smi (empty to auto-detect on PATH).
    default: "/usr/lib/wsl/lib/nvidia-smi"
  grace_s:
    type: int
    label: Grace seconds
    description: Seconds between sms_swap and the actual model kill (lets the agent finish its turn).
    default: 10
  drain_timeout_s:
    type: int
    label: Drain stall timeout (s)
    description: After the grace countdown, in-flight requests are allowed to finish. The model is cut early only if generation makes no progress for this many seconds (0 = do not wait).
    default: 120
  drain_max_s:
    type: int
    label: Drain maximum (s)
    description: Hard cap on the drain even while a request keeps generating (a long reasoning reply), so a swap never waits forever.
    default: 600
  drain_quiet_s:
    type: int
    label: Drain quiet window (s)
    description: The engine must stay without requests for this many seconds in a row before the model is cut. A turn is a chain of requests with short gaps (tool calls), so one idle read does not mean it ended (0 = cut on the first idle read).
    default: 8
  vram_settle_mib:
    type: int
    label: VRAM settle threshold (MiB)
    description: Wait until every GPU's used VRAM is below this after a kill.
    default: 300
  vram_settle_timeout_s:
    type: int
    label: VRAM settle timeout (s)
    description: Max seconds to wait for VRAM to settle.
    default: 90
  comfy_url:
    type: str
    label: ComfyUI URL
    description: ComfyUI base URL for cohabitation checks.
    default: "http://127.0.0.1:8188"
  idle_restore_min:
    type: int
    label: Restore the primary after N idle minutes
    description: After a swap to a smaller model, bring the primary back once the engine has been idle this long (no tokens processed, no gpu_job.sh running, no ComfyUI work queued or running) and the release gate passes. 0 disables it.
    default: 15
  comfy_free_on_idle:
    type: bool
    label: Ask an idle ComfyUI to release its VRAM
    description: When the idle restore is due but the primary does not fit because an idle ComfyUI (empty queue) still caches models in VRAM, ask it to unload them (POST /free) and try again. ComfyUI keeps running; nothing is killed.
    default: true
  gpu_job_mode:
    type: str
    label: What to do with the LLM during a GPU job
    description: 'Mode applied by `gpu_job.sh auto` (also selectable in the dashboard and Desktop). "auto" picks the best for this machine (multi with 2+ GPUs, otherwise none); "none" unloads the LLM; "nano" keeps the small model in its normal layout; "multi" loads the small model whole on one GPU and leaves another to the job; "keep" leaves the loaded model alone.'
    default: auto
  auto_recover:
    type: bool
    label: Swap to another model when one fails
    description: If a model fails to load, or its server dies while serving, load another model that fits instead of leaving the agent without an LLM (the primary first, then from small to big). A model that just failed is not retried automatically for 30 minutes.
    default: true
  after_gpu_job:
    type: str
    label: Model that answers after a GPU job
    description: '"small" (default) delivers the result with the small model — the one already loaded, or the smallest that fits if the LLM was unloaded for the job — and the primary comes back on demand (sms_restore) or after idle_restore_min. "primary" reloads the primary as soon as the job ends (slower reply).'
    default: small
  block_when_unloaded:
    type: bool
    label: Answer at once while the LLM is unloaded on purpose
    description: When a message arrives while a gpu_job.sh holds the GPU, a swap/load is in flight, or an interrupted swap is being resumed, end the turn immediately with an explanation (the user is asked to resend) instead of letting Hermes retry for minutes and fail with "HTTP 503 Loading model".
    default: true
  guard_tools:
    type: bool
    label: Block manual LLM management by the agent
    description: Vetoes terminal/execute_code commands that stop, kill or launch llama-server behind SmartModelProvider (systemctl llama-server, pkill, ~/llama-server.sh); ComfyUI launches while any model is loaded or a swap runs, unless they go through gpu_job.sh or carry SMS_ALLOW_GPU=1; blocking `hermes sms` commands (swap/restore --wait, wait, after-job, stop --graceful) in the foreground; and gpu_job.sh in the foreground or without notify=true. Blocks are logged in cache/smart-model-swap/guard.log.
    default: true
  inject_status:
    type: bool
    label: Tell the model when a secondary model is active
    description: Adds a one-line note to the turn while the primary model is unloaded or a swap is in flight.
    default: true
